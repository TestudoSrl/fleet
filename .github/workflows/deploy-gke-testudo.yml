name: Deploy Fleet to Testudo GKE

on:
  workflow_dispatch:
  push:
    branches:
      - agent/testudo-gke-deployment
    paths:
      - .github/workflows/deploy-gke-testudo.yml
      - k8s/testudo/**
      - scripts/testudo/**

concurrency:
  group: fleet-testudo-development
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGION: europe-west1
  CLUSTER: tst-kube
  NAMESPACE: fleet
  HOSTNAME: mdm.testudosrl.dev
  BACKUP_BUCKET: testudo-dev-fleet-mysql-backups

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: Development
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Validate required configuration
        env:
          GCP_KEY: ${{ secrets.TESTUDO_DEV_GCP_SA_KEY }}
          FLEET_SECRET_BLOB: ${{ secrets.FLEET_SECRETS_ENV }}
          BACKUP_GCP_KEY: ${{ secrets.FLEET_BACKUP_GCP_SA_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID_DEV }}
          GCP_PROJECT: ${{ vars.GCP_DEV_PROJECT }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${GCP_KEY}" ] && missing+=(secret:TESTUDO_DEV_GCP_SA_KEY)
          [ -z "${FLEET_SECRET_BLOB}" ] && missing+=(secret:FLEET_SECRETS_ENV)
          [ -z "${BACKUP_GCP_KEY}" ] && missing+=(secret:FLEET_BACKUP_GCP_SA_KEY)
          [ -z "${CF_TOKEN}" ] && missing+=(secret:CLOUDFLARE_API_TOKEN_DEV)
          [ -z "${CF_ZONE}" ] && missing+=(secret:CLOUDFLARE_ZONE_ID_DEV)
          [ -z "${GCP_PROJECT}" ] && missing+=(var:GCP_DEV_PROJECT)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing Development configuration: ${missing[*]}"
            exit 1
          fi
          for key in mysql-password mysql-root-password redis-password fleet-server-private-key; do
            grep -q "^${key}=" <<<"${FLEET_SECRET_BLOB}" || {
              echo "::error::FLEET_SECRETS_ENV is missing ${key}"
              exit 1
            }
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.TESTUDO_DEV_GCP_SA_KEY }}

      - name: Set up gcloud and GKE auth plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: "565.0.0"
          install_components: gke-gcloud-auth-plugin

      - name: Get tst-kube credentials
        run: |
          gcloud container clusters get-credentials "${CLUSTER}" \
            --region "${REGION}" \
            --project "${{ vars.GCP_DEV_PROJECT }}"

      - name: Create namespace and materialize Kubernetes secret
        env:
          FLEET_SECRETS_ENV: ${{ secrets.FLEET_SECRETS_ENV }}
          FLEET_BACKUP_GCP_SA_KEY: ${{ secrets.FLEET_BACKUP_GCP_SA_KEY }}
        run: |
          set -euo pipefail
          kubectl apply -f k8s/testudo/base/namespace.yaml
          secret_file="${RUNNER_TEMP}/fleet.env"
          umask 077
          printf '%s\n' "${FLEET_SECRETS_ENV}" > "${secret_file}"
          kubectl -n "${NAMESPACE}" create secret generic fleet-secrets \
            --from-env-file="${secret_file}" \
            --dry-run=client -o yaml | kubectl apply -f -
          backup_key_file="${RUNNER_TEMP}/fleet-backup-gcp.json"
          printf '%s' "${FLEET_BACKUP_GCP_SA_KEY}" > "${backup_key_file}"
          kubectl -n "${NAMESPACE}" create secret generic fleet-backup-gcp \
            --from-file=credentials.json="${backup_key_file}" \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f "${secret_file}"
          rm -f "${backup_key_file}"

      - name: Apply and wait for MySQL
        run: |
          kubectl -n "${NAMESPACE}" apply -k k8s/testudo/base/mysql
          kubectl -n "${NAMESPACE}" rollout status statefulset/mysql --timeout=15m
          kubectl -n "${NAMESPACE}" wait --for=jsonpath='{.status.phase}'=Bound \
            pvc/mysql-data-mysql-0 --timeout=10m

      - name: Apply and wait for Redis
        run: |
          kubectl -n "${NAMESPACE}" apply -k k8s/testudo/base/redis
          kubectl -n "${NAMESPACE}" rollout status deployment/redis --timeout=10m

      - name: Apply database network policy
        run: kubectl -n "${NAMESPACE}" apply -k k8s/testudo/base/network-policies

      - name: Prepare Fleet database
        run: |
          kubectl -n "${NAMESPACE}" delete job fleet-prepare-db --ignore-not-found=true
          kubectl -n "${NAMESPACE}" apply -f k8s/testudo/jobs/prepare-db.yaml
          if ! kubectl -n "${NAMESPACE}" wait --for=condition=complete \
            job/fleet-prepare-db --timeout=15m; then
            kubectl -n "${NAMESPACE}" describe job fleet-prepare-db || true
            kubectl -n "${NAMESPACE}" logs job/fleet-prepare-db --all-containers --tail=200 || true
            exit 1
          fi

      - name: Deploy Fleet and Ingress
        run: |
          kubectl -n "${NAMESPACE}" apply -k k8s/testudo/base/fleet
          kubectl -n "${NAMESPACE}" rollout status deployment/fleet --timeout=15m
          kubectl -n "${NAMESPACE}" apply -k k8s/testudo/base/ingress

      - name: Configure daily off-cluster backup
        env:
          GCP_PROJECT: ${{ vars.GCP_DEV_PROJECT }}
          FLEET_BACKUP_BUCKET: ${{ env.BACKUP_BUCKET }}
        run: |
          kubectl -n "${NAMESPACE}" apply -k k8s/testudo/base/backup
          bash scripts/testudo/configure-backup-gcs.sh

      - name: Wait for Ingress IP and update Cloudflare DNS
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID_DEV }}
        run: |
          ingress_ip=""
          for attempt in $(seq 1 80); do
            ingress_ip="$(kubectl -n "${NAMESPACE}" get ingress fleet \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"
            [ -n "${ingress_ip}" ] && break
            echo "Waiting for Ingress IP (${attempt}/80)"
            sleep 15
          done
          if [ -z "${ingress_ip}" ]; then
            kubectl -n "${NAMESPACE}" describe ingress fleet || true
            exit 1
          fi
          bash scripts/testudo/upsert-dns.sh "${HOSTNAME}" "${ingress_ip}"

      - name: HTTPS smoke test
        run: |
          for attempt in $(seq 1 90); do
            health_code="$(curl -sS -o /dev/null -w '%{http_code}' \
              --max-time 15 "https://${HOSTNAME}/healthz" || true)"
            root_code="$(curl -sS -o /dev/null -w '%{http_code}' \
              --max-time 15 "https://${HOSTNAME}/" || true)"
            echo "Attempt ${attempt}: health=${health_code:-000} root=${root_code:-000}"
            if [ "${health_code}" = "200" ] && \
              { [ "${root_code}" = "200" ] || [ "${root_code}" = "307" ]; }; then
              curl -fsS "https://${HOSTNAME}/healthz" >/dev/null
              curl -fsSL "https://${HOSTNAME}/" | grep -qi fleet
              exit 0
            fi
            sleep 10
          done
          kubectl -n "${NAMESPACE}" get all,pvc,ingress
          kubectl -n "${NAMESPACE}" describe ingress fleet || true
          exit 1

      - name: Final Kubernetes state
        run: |
          kubectl -n "${NAMESPACE}" get pods
          kubectl -n "${NAMESPACE}" get statefulset
          kubectl -n "${NAMESPACE}" get pvc
          kubectl -n "${NAMESPACE}" get svc
          kubectl -n "${NAMESPACE}" get ingress
