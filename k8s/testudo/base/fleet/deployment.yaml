apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet
  labels:
    app.kubernetes.io/name: fleet
    app.kubernetes.io/part-of: fleet
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet
        app.kubernetes.io/part-of: fleet
    spec:
      serviceAccountName: fleet
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 3333
        runAsGroup: 3333
        fsGroup: 3333
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 90
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -ec
            - until nc -z mysql 3306; do sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
        - name: wait-for-redis
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -ec
            - until nc -z redis 6379; do sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
      containers:
        - name: fleet
          image: fleetdm/fleet:v4.90.1
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/fleet
          args:
            - serve
          env:
            - name: FLEET_SERVER_ADDRESS
              value: 0.0.0.0:8080
            - name: FLEET_SERVER_TLS
              value: "false"
            - name: FLEET_SERVER_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: fleet-secrets
                  key: fleet-server-private-key
            - name: FLEET_MYSQL_ADDRESS
              value: mysql:3306
            - name: FLEET_MYSQL_DATABASE
              value: fleet
            - name: FLEET_MYSQL_USERNAME
              value: fleet
            - name: FLEET_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fleet-secrets
                  key: mysql-password
            - name: FLEET_MYSQL_MAX_OPEN_CONNS
              value: "25"
            - name: FLEET_MYSQL_MAX_IDLE_CONNS
              value: "25"
            - name: FLEET_REDIS_ADDRESS
              value: redis:6379
            - name: FLEET_REDIS_DATABASE
              value: "0"
            - name: FLEET_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fleet-secrets
                  key: redis-password
            - name: FLEET_REDIS_CONNECT_RETRY_ATTEMPTS
              value: "10"
            - name: FLEET_LOGGING_JSON
              value: "true"
            - name: FLEET_LOGGING_DEBUG
              value: "false"
            - name: FLEET_OSQUERY_STATUS_LOG_PLUGIN
              value: filesystem
            - name: FLEET_OSQUERY_RESULT_LOG_PLUGIN
              value: filesystem
            - name: FLEET_FILESYSTEM_STATUS_LOG_FILE
              value: /logs/osquery_status
            - name: FLEET_FILESYSTEM_RESULT_LOG_FILE
              value: /logs/osquery_result
            - name: FLEET_FILESYSTEM_ENABLE_LOG_ROTATION
              value: "true"
            - name: FLEET_VULNERABILITIES_DATABASES_PATH
              value: /tmp/vuln
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 512Mi
            limits:
              cpu: "1"
              memory: 4Gi
              ephemeral-storage: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: osquery-logs
              mountPath: /logs
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: osquery-logs
          emptyDir:
            sizeLimit: 1Gi

