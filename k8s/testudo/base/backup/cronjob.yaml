apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup
  labels:
    app.kubernetes.io/name: fleet-backup
    app.kubernetes.io/part-of: fleet
spec:
  schedule: "17 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: fleet-backup
            app.kubernetes.io/part-of: fleet
            job-type: mysql-backup
        spec:
          serviceAccountName: fleet-backup
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: mysqldump
              image: mysql:8.0.44
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  file="/backup/fleet-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
                  mysqldump --single-transaction --quick --lock-tables=false --no-tablespaces \
                    --host=mysql --user=fleet fleet | gzip > "$file"
                  test -s "$file"
              env:
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: fleet-secrets
                      key: mysql-password
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                  ephemeral-storage: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
                  ephemeral-storage: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
            - name: upload
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:578.0.0-slim
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - gcloud storage cp /backup/*.sql.gz gs://testudo-dev-fleet-mysql-backups/mysql/
              env:
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: /var/run/gcp/credentials.json
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                  ephemeral-storage: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
                  ephemeral-storage: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: gcloud-config
                  mountPath: /.config
                - name: tmp
                  mountPath: /tmp
                - name: gcp-credentials
                  mountPath: /var/run/gcp
                  readOnly: true
          containers:
            - name: complete
              image: busybox:1.37.0
              command:
                - /bin/sh
                - -ec
                - test -s /backup/*.sql.gz
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                  ephemeral-storage: 16Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
                  ephemeral-storage: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              emptyDir:
                sizeLimit: 2Gi
            - name: gcloud-config
              emptyDir:
                sizeLimit: 64Mi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
            - name: gcp-credentials
              secret:
                secretName: fleet-backup-gcp
                defaultMode: 0400
