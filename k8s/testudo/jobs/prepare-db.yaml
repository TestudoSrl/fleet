apiVersion: batch/v1
kind: Job
metadata:
  name: fleet-prepare-db
  labels:
    app.kubernetes.io/name: fleet
    app.kubernetes.io/part-of: fleet
    job-type: fleet-db-migration
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet
        app.kubernetes.io/part-of: fleet
        job-type: fleet-db-migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 3333
        runAsGroup: 3333
        fsGroup: 3333
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -ec
            - until nc -z mysql 3306; do sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
      containers:
        - name: fleet-prepare-db
          image: fleetdm/fleet:v4.90.1
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/fleet
          args:
            - prepare
            - db
            - --no-prompt
          env:
            - name: FLEET_MYSQL_ADDRESS
              value: mysql:3306
            - name: FLEET_MYSQL_DATABASE
              value: fleet
            - name: FLEET_MYSQL_USERNAME
              value: fleet
            - name: FLEET_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fleet-secrets
                  key: mysql-password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

